name: Release Gate

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  test:
    name: Test at tag (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: php -l sweep
        run: for f in $(find src bin -name '*.php'); do php -l "$f" > /dev/null || exit 1; done && echo LINT_OK

      - name: test_state
        run: php bin/test_state.php

      - name: test_ratelimit
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_ratelimit.php

      - name: test_pipeline
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_pipeline.php

      - name: test_m3b
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_m3b.php

      - name: test_m3c
        run: php bin/test_m3c.php

      - name: test_m4
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_m4.php

      - name: conformance
        run: php bin/conformance.php

  composer-audit:
    name: Composer audit at tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer audit
        run: |
          if [ -n "$(composer show --locked --direct 2>/dev/null)" ]; then
            composer audit --locked
          else
            echo "No locked dependencies to audit (platform-only package); nothing to fail on."
          fi
