name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: php -l sweep
        run: for f in $(find src bin -name '*.php'); do php -l "$f" > /dev/null || exit 1; done && echo LINT_OK

      - name: test_state
        run: php bin/test_state.php --integration

      - name: test_ratelimit
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_ratelimit.php

      - name: test_geo_rate_limits
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_geo_rate_limits.php

      - name: test_pipeline
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_pipeline.php

      - name: test_m3b
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_m3b.php

      - name: test_m3c
        run: php bin/test_m3c.php

      - name: test_m4
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_m4.php

      - name: conformance
        run: php bin/conformance.php

      - name: conformance_safety
        run: php bin/conformance_safety.php

      - name: conformance_events
        run: php bin/conformance_events.php

      - name: conformance_redis
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/conformance_redis.php

      - name: test_nfkc
        run: php bin/test_nfkc.php

      - name: test_binary_noise_gate
        run: php bin/test_binary_noise_gate.php

      - name: test_recon_context_gate
        run: php bin/test_recon_context_gate.php

      - name: test_recon_raw_view_scan
        run: php bin/test_recon_raw_view_scan.php

      - name: test_body_form_scan
        run: php bin/test_body_form_scan.php

      - name: test_json_walk
        run: php bin/test_json_walk.php

      - name: test_exempt_ips
        run: php bin/test_exempt_ips.php

      - name: test_excluded_headers
        run: php bin/test_excluded_headers.php

      - name: test_cors
        run: php bin/test_cors.php

      - name: test_geo_country
        run: php bin/test_geo_country.php

      - name: test_geo_lifecycle
        run: php bin/test_geo_lifecycle.php

      - name: test_security_headers
        run: php bin/test_security_headers.php

      - name: test_behavior
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_behavior.php

      - name: test_large_body
        run: php bin/test_large_body.php

      - name: test_redos_gates
        run: php bin/test_redos_gates.php

      - name: test_performance_monitor
        run: php bin/test_performance_monitor.php

      - name: test_support
        run: php bin/test_support.php

      - name: test_pattern_registry
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_pattern_registry.php

      - name: test_config_fields
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_config_fields.php

      - name: test_events_parity
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_events_parity.php

      - name: test_decorators
        run: php bin/test_decorators.php

  conformance-pipeline:
    name: Conformance pipeline (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: conformance_pipeline
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/conformance_pipeline.php

  coverage:
    name: coverage (100% lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP with pcov
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Collect suite coverage
        env:
          REDIS_HOST: 127.0.0.1
        run: |
          mkdir -p build
          php .github/coverage-runner.php --collect bin/test_state.php build/coverage-test_state.php --integration
          for suite in test_parity_seam test_ratelimit test_geo_rate_limits test_pipeline test_m3b test_m4 test_behavior test_m3c conformance conformance_safety conformance_events conformance_redis test_nfkc test_binary_noise_gate test_recon_context_gate test_recon_raw_view_scan test_body_form_scan test_json_walk test_exempt_ips test_excluded_headers test_cors test_geo_country test_geo_lifecycle test_event_bus test_security_headers test_large_body test_support test_redos_gates test_performance_monitor test_enrichment test_composite_handlers test_json_logging test_pattern_registry test_config_fields test_events_parity test_decorators; do
            php .github/coverage-runner.php --collect "bin/${suite}.php" "build/coverage-${suite}.php"
          done

      - name: Enforce 100% line coverage
        run: php .github/coverage-runner.php --merge build/coverage-*.php

      - name: test_event_bus
        run: php bin/test_event_bus.php

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer audit
        run: |
          if [ -n "$(composer show --locked --direct 2>/dev/null)" ]; then
            composer audit --locked
          else
            echo "No locked dependencies to audit (platform-only package); nothing to fail on."
          fi
